<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Platform 登录测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .info h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .info p {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }
        .info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 IoT Platform 登录测试</h1>
        
        <div class="info">
            <h3>📋 测试说明</h3>
            <p>• 后端 API: <code id="apiUrl">http://101.126.17.35:8000</code></p>
            <p>• 用户名: <code>admin</code></p>
            <p>• 密码: <code>admin123</code></p>
            <p style="margin-top: 10px; font-size: 12px; color: #999;">
                💡 提示：如果登录成功，会显示 Token 信息
            </p>
        </div>

        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" value="admin" placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" value="admin123" placeholder="请输入密码">
        </div>

        <button id="loginBtn" onclick="doLogin()">
            登录测试
        </button>

        <div id="result" class="result"></div>
    </div>

    <script>
        function doLogin() {
            const btn = document.getElementById('loginBtn');
            const result = document.getElementById('result');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 显示加载状态
            btn.innerHTML = '<span class="loading"></span> 登录中...';
            btn.disabled = true;
            result.style.display = 'none';

            // 获取 API 地址
            const apiBase = 'http://101.126.17.35:8000/api/v1';

            fetch(`${apiBase}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                return res.json();
            })
            .then(data => {
                result.className = 'result success';
                result.style.display = 'block';
                result.innerHTML = `
                    <strong>✅ 登录成功！</strong><br><br>
                    <strong>Token:</strong><br>
                    <code style="word-break: break-all; font-size: 11px;">${data.access_token}</code><br><br>
                    <strong>Token Type:</strong> ${data.token_type}
                `;
                btn.innerHTML = '登录测试';
                btn.disabled = false;
            })
            .catch(err => {
                result.className = 'result error';
                result.style.display = 'block';
                result.innerHTML = `
                    <strong>❌ 登录失败</strong><br><br>
                    ${err.message}<br><br>
                    <small>请检查：<br>
                    1. 后端服务是否运行<br>
                    2. 网络是否可访问<br>
                    3. 用户名密码是否正确</small>
                `;
                btn.innerHTML = '登录测试';
                btn.disabled = false;
            });
        }

        // 页面加载时自动检测 API 地址
        window.onload = function() {
            // 尝试从当前域名获取 API 地址
            const currentHost = window.location.hostname;
            if (currentHost !== '101.126.17.35') {
                // 使用相对路径（如果后端配置了代理）
                document.getElementById('apiUrl').textContent = `${window.location.origin}/api/v1`;
            }
        };
    </script>
</body>
</html>
